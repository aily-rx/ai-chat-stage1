server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-chat-stage1
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

app:
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
